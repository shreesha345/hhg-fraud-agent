[project]
name = "fraud-py"
version = "0.1.0"
description = "Offline analytics for the TigerGraph fraud investigation agent: profiling, features, calibration, test data."
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.0",
  "pandas>=2.0",
  "pyarrow>=15",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "nbformat>=5.9",
  "nbclient>=0.10",
  "nbconvert>=7.16",
  "ipykernel>=6.29",
  "jupyterlab>=4.1",
  "tigergraph-mcp>=1.0.3",
  "pymupdf>=1.28.2",
]

[tool.uv]
package = false
